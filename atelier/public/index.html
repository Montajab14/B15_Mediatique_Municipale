<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web — assistant de la médiathèque municipale</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Cap Web</h1>
    <ul id="messages"></ul>
    <form id="chat-form">
      <label for="message">Votre message :</label>
      <textarea id="message" maxlength="330"></textarea>
      <button type="submit">Envoyer</button>
    </form>
    <ul id="suggestions">
      <li><button type="button">Quels sont les horaires de la médiathèque ?</button></li>
      <li><button type="button">Comment s'inscrire à la médiathèque ?</button></li>
      <li><button type="button">Combien de livres peut-on emprunter ?</button></li>
    </ul>
    <button type="button" id="effacer">Effacer la conversation</button>
    <p id="status" role="status"></p>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
