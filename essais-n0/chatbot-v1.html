<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant Médiathèque Municipale — V1</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg: #0284c7;
      --bot-msg: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 600px;
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .chat-header {
      padding: 20px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    .chat-header h1 {
      font-size: 1.25rem;
      color: var(--accent);
    }

    .chat-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.bot {
      background-color: var(--bot-msg);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message.user {
      background-color: var(--user-msg);
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-input-area {
      padding: 16px;
      background-color: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: var(--text-light);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 12px 20px;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>Assistant Médiathèque Municipale</h1>
      <p>Posez vos questions sur les horaires, les services et événements</p>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        Bonjour ! Je suis l'assistant virtuel de la médiathèque. Comment puis-je vous aider aujourd'hui ?
      </div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Écrivez votre message..." required autocomplete="off" />
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('userInput');
    const messagesContainer = document.getElementById('messages');

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const userText = input.value.trim();
      if (!userText) return;

      addMessage(userText, 'user');
      input.value = '';

      setTimeout(() => {
        const lower = userText.toLowerCase();
        let reply = "Je ne suis pas sûr de comprendre. Pouvez-vous reformuler ou taper 'aide' ?";

        if (lower.includes('salut') || lower.includes('bonjour') || lower.includes('coucou')) {
          reply = "Bonjour ! Bienvenue à la médiathèque municipale. Que recherchez-vous ?";
        } else if (lower.includes('aide') || lower.includes('test')) {
          reply = "Vous pouvez me poser des questions sur les documents (ex: 330), les espaces (ex: prairie) ou les services aux citoyens (ex: voisin).";
        } else if (lower.includes('330')) {
          reply = "Le secteur 330 de la médiathèque regroupe les ouvrages de sciences sociales et d'économie.";
        } else if (lower.includes('prairie')) {
          reply = "La Prairie est notre espace de lecture extérieur et de détente ouvert tout l'été !";
        } else if (lower.includes('voisin')) {
          reply = "Notre programme 'Voisin Relais' permet d'emprunter des livres pour vos voisins à mobilité réduite.";
        }

        addMessage(reply, 'bot');
      }, 500);
    });
  </script>

</body>
</html>
