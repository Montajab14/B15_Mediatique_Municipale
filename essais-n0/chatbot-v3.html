<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant Médiathèque Municipale — V3 (Refus des messages vides)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --danger: #f43f5e;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg: #0284c7;
      --bot-msg: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 600px;
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .chat-header {
      padding: 20px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      font-size: 1.1rem;
      color: var(--accent);
    }

    .chat-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .clear-btn {
      padding: 6px 12px;
      background-color: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .clear-btn:hover {
      background-color: var(--danger);
      color: #fff;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.bot {
      background-color: var(--bot-msg);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message.user {
      background-color: var(--user-msg);
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .error-banner {
      background-color: rgba(244, 63, 94, 0.2);
      color: var(--danger);
      padding: 8px 16px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .chat-input-area {
      padding: 16px;
      background-color: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: var(--text-light);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .send-btn {
      padding: 12px 20px;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div>
        <h1>Assistant Médiathèque — V3</h1>
        <p>Refus des messages vides</p>
      </div>
      <button class="clear-btn" id="clearBtn">Effacer</button>
    </div>

    <div class="error-banner" id="errorBanner">Veuillez entrer un message non vide.</div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        Bonjour ! Je suis l'assistant virtuel de la médiathèque. Comment puis-je vous aider aujourd'hui ?
      </div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Écrivez votre message..." autocomplete="off" />
      <button type="submit" class="send-btn">Envoyer</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('userInput');
    const messagesContainer = document.getElementById('messages');
    const clearBtn = document.getElementById('clearBtn');
    const errorBanner = document.getElementById('errorBanner');

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    clearBtn.addEventListener('click', () => {
      messagesContainer.innerHTML = '';
      errorBanner.style.display = 'none';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const userText = input.value.trim();
      
      // Validation : refus des espaces vides
      if (!userText) {
        errorBanner.style.display = 'block';
        return;
      }
      
      errorBanner.style.display = 'none';
      addMessage(userText, 'user');
      input.value = '';

      setTimeout(() => {
        const lower = userText.toLowerCase();
        let reply = "Je ne suis pas sûr de comprendre. Pouvez-vous reformuler ou taper 'aide' ?";

        if (lower.includes('salut') || lower.includes('bonjour') || lower.includes('coucou')) {
          reply = "Bonjour ! Bienvenue à la médiathèque municipale. Que recherchez-vous ?";
        } else if (lower.includes('aide') || lower.includes('test')) {
          reply = "Vous pouvez me poser des questions sur les documents (ex: 330), les espaces (ex: prairie) ou les services aux citoyens (ex: voisin).";
        } else if (lower.includes('330')) {
          reply = "Le secteur 330 de la médiathèque regroupe les ouvrages de sciences sociales et d'économie.";
        } else if (lower.includes('prairie')) {
          reply = "La Prairie est notre espace de lecture extérieur et de détente ouvert tout l'été !";
        } else if (lower.includes('voisin')) {
          reply = "Notre programme 'Voisin Relais' permet d'emprunter des livres pour vos voisins à mobilité réduite.";
        }

        addMessage(reply, 'bot');
      }, 500);
    });
  </script>

</body>
</html>
